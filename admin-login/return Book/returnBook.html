<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Return Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../images/logo.jpg">
</head>
<body class="bg-light" onload="noBack();">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 fixed-top">
    <a class="navbar-brand fw-bold" href="../DashBoard page/DashBoard.html"><i class="fa-solid fa-book-open"></i> Digital Library</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="../DashBoard page/DashBoard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="../book page/books.html">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="../member page/member.html">Members</a></li>
        <li class="nav-item"><a class="nav-link" href="../report page/Report.html">Reports</a></li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar + Main Content -->
  <div class="container-fluid mt-4 pt-3">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-2 bg-warning pt-4 vh-100">
        <ul class="list-unstyled">
          <li class="mb-3"><a href="../book page/books.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-book me-2"></i> Books</a></li>
          <li class="mb-3"><a href="../member page/member.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-users me-2"></i> Members</a></li>
          <li class="mb-3"><a href="../issued book/issue.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-arrow-up me-2"></i> Issue Book</a></li>
          <li class="mb-3"><a href="../return Book/returnBook.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-arrow-down me-2"></i> Return Book</a></li>
          <li class="mb-3"><a href="../report page/Report.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-chart-bar me-2"></i> Reports</a></li>
          <li class="mb-3"><a href="../about/about.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-circle-info me-2"></i> About</a></li>
          <li class="mt-4"><a href="../../login/login.html" class="btn btn-danger text-white w-100 text-start rounded-3 shadow-lg"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</a></li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="col-md-10 p-4">
        <header>
          <h2>Return Book Form</h2>
          <a href="#" id="returnBookbtn" class="btn btn-danger mb-4">Return Book</a>
        </header>

        <!-- Return Book Form -->
        <form id="returnBook">
          <div class="row g-3 border border-info border-3 rounded-3 p-2 mb-3">
            <div class="col-md-4">
              <label class="form-label">Book ID</label>
              <input type="number" id="bookId" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Book Name</label>
              <input type="text" id="bookName" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Member</label>
              <input type="text" id="member" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Issued Date</label>
              <input type="date" id="date" class="form-control" required>
            </div>
            <div class="mt-3 text-center py-2">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="reset" class="btn btn-secondary">Cancel</button>
            </div>
          </div>
        </form>

        <!-- Return Book Table -->
        <table class="table table-bordered text-center">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Book Name</th>
              <th>Member</th>
              <th>Issued Date</th>
              <th>Status</th>
              <th>action</th>
            </tr>
          </thead>
          <tbody id="ReturnTable">
            <tr>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td>                
                  <button class="btn btn-primary me-1" onclick="editBook(1)">Edit</button>
                  <button class="btn btn-danger" onclick="deleteBooks(1)">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const returnForm = document.getElementById("returnBook");
  const tbody = document.getElementById("ReturnTable");
  const addBtn = document.getElementById("returnBookbtn");

  function logActivity(type, text) {
    let activities;
    try {
      activities = JSON.parse(localStorage.getItem("activities")) || [];
    } catch {
      activities = [];
    }
    activities.push({ type, text, time: new Date().toISOString() });
    localStorage.setItem("activities", JSON.stringify(activities.slice(-100)));
  }

  // ✅ Load return books from localStorage
  function loadReturnBooks() {
    const returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    tbody.innerHTML = "";
    returnbooks.forEach(book => {
      const row = `
        <tr>
          <td>${book.id}</td>
          <td>${book.name}</td>
          <td>${book.member}</td>
          <td>${book.date}</td>
          <td>${book.status}</td>
          <td>
            <div class="d-flex justify-content-center">
              <button class="btn btn-primary me-2" onclick="editBook('${book.id}')">Edit</button>
              <button class="btn btn-danger" onclick="deleteBook('${book.id}')">Delete</button>
            </div>
          </td>
        </tr>
      `;
      tbody.insertAdjacentHTML("beforeend", row);
    });
  }

  // ✅ Handle form submission (Add or Update)
  returnForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const id = document.getElementById("bookId").value.trim();
    const name = document.getElementById("bookName").value.trim();
    const member = document.getElementById("member").value.trim();
    const date = document.getElementById("date").value.trim();
    const status = "Returned"

    if (!id || !name || !member || !date) {
      alert("Please fill all required fields correctly!");
      return;
    }

    const issuedBooks = JSON.parse(localStorage.getItem("issuedBooks")) || [];
    const issuedBook = issuedBooks.find(book => String(book.id) === String(id));
    if (!issuedBook) {
      alert("This Book ID is not currently recorded as issued.");
      return;
    }

    let returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    const index = returnbooks.findIndex(book => String(book.id) === String(id));
    if (index !== -1) {
      alert("This Book ID has already been returned.");
      return;
    }

    const returnedBook = {
      id,
      name: issuedBook.name,
      member: issuedBook.member,
      date: issuedBook.date,
      status
    };

    returnbooks.push(returnedBook);
    alert("Book returned successfully!");

    localStorage.setItem("returnbooks", JSON.stringify(returnbooks));
    logActivity("return", `Book returned: "${returnedBook.name}" by ${returnedBook.member}`);
    this.reset();
    loadReturnBooks();
  });

  // ✅ Focus Book ID when clicking "Return Book" button
  addBtn.addEventListener("click", (event) => {
    event.preventDefault();
    document.getElementById("bookId").focus();
  });

  // ✅ Delete function
  window.deleteBook = function(id) {
    let returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    if (confirm("Are you sure you want to delete this book?")) {
      returnbooks = returnbooks.filter(b => b.id !== id);
      localStorage.setItem("returnbooks", JSON.stringify(returnbooks));
      alert("Book deleted successfully!");
      loadReturnBooks();
    }
  };

  // ✅ Edit function
  window.editBook = function(id) {
    const returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    const book = returnbooks.find(b => b.id === id);
    if (!book) return;

    document.getElementById("bookId").value = book.id;
    document.getElementById("bookName").value = book.name;
    document.getElementById("author").value = book.member;
    document.getElementById("Category").value = book.date;
    document.getElementById("year").value = book.status;
  };

  // ✅ Initial load
  loadReturnBooks();
document.querySelector(".btn-danger").addEventListener("click", () => {
  // Remove only login/session data
  localStorage.removeItem("userEmail");
  localStorage.removeItem("userPassword");
  localStorage.removeItem("userRole");
  window.location.href = "../../login/login.html";
});
if (!localStorage.getItem("userRole")) {
  window.location.href = "../../login/login.html";
}

// Prevent forward/back navigation after logout
window.history.forward();
function noBack() {
  window.history.forward();
}

});
</script>


</body>
</html>
