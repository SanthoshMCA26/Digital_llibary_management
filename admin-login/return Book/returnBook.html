<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Return Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../images/logo.jpg">
  <style>
    .return-table-scroll {
      max-height: 190px;
      overflow-y: auto;
    }

    .return-table-scroll thead th {
      position: sticky;
      top: 0;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-light" onload="noBack();">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 fixed-top">
    <a class="navbar-brand fw-bold" href="../DashBoard page/DashBoard.html"><i class="fa-solid fa-book-open"></i> Digital Library</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="../DashBoard page/DashBoard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="../book page/books.html">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="../member page/member.html">Members</a></li>
        <li class="nav-item"><a class="nav-link" href="../report page/Report.html">Reports</a></li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar + Main Content -->
  <div class="container-fluid mt-4 pt-3">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-2 bg-warning pt-4 vh-100">
        <ul class="list-unstyled">
          <li class="mb-3"><a href="../book page/books.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-book me-2"></i> Books</a></li>
          <li class="mb-3"><a href="../member page/member.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-users me-2"></i> Members</a></li>
          <li class="mb-3"><a href="../issued book/issue.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-arrow-up me-2"></i> Issue Book</a></li>
          <li class="mb-3"><a href="../return Book/returnBook.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-arrow-down me-2"></i> Return Book</a></li>
          <li class="mb-3"><a href="../report page/Report.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-chart-bar me-2"></i> Reports</a></li>
          <li class="mb-3"><a href="../about/about.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-circle-info me-2"></i> About</a></li>
          <li class="mt-4"><a href="../../login/login.html" class="btn btn-danger text-white w-100 text-start rounded-3 shadow-lg"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</a></li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="col-md-10 p-4">
        <header>
          <h2>Return Book Form</h2>
          <a href="#" id="returnBookbtn" class="btn btn-danger mb-4">Return Book</a>
        </header>

        <!-- Return Book Form -->
        <form id="returnBook">
          <div class="row g-3 border border-info border-3 rounded-3 p-2 mb-3">
            <div class="col-md-4">
              <label for="bookId" class="form-label">Book ID</label>
              <input type="number" id="bookId" class="form-control" required>
              <div id="bookLookupMessage" class="form-text">Enter an issued Book ID to load its details.</div>
            </div>
            <div class="col-md-4">
              <label for="bookName" class="form-label">Book Name</label>
              <input type="text" id="bookName" class="form-control" readonly required>
            </div>
            <div class="col-md-4">
              <label for="memberId" class="form-label">Member ID</label>
              <input type="number" id="memberId" class="form-control" min="1" required>
            </div>
            <div class="col-md-4">
              <label for="member" class="form-label">Member</label>
              <input type="text" id="member" class="form-control" readonly required>
            </div>
            <div class="col-md-4">
              <label for="date" class="form-label">Issued Date</label>
              <input type="date" id="date" class="form-control" readonly required>
            </div>
            <div class="mt-3 text-center py-2">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="reset" class="btn btn-secondary">Cancel</button>
            </div>
          </div>
        </form>

        <!-- Return Book Table -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
          <span id="selectedReturnCount" class="text-muted" aria-live="polite">0 selected</span>
          <button type="button" id="deleteSelectedReturnsBtn" class="btn btn-danger" disabled>Delete Selected</button>
        </div>
        <div class="return-table-scroll">
          <table class="table table-bordered text-center mb-0">
            <thead class="table-light">
              <tr>
                <th><input type="checkbox" id="selectAllReturns" class="form-check-input" aria-label="Select all returned records"></th>
                <th>ID</th>
                <th>Book Name</th>
                <th>Member</th>
                <th>Quantity</th>
                <th>Return Date</th>
                <th>Status</th>
                <th>action</th>
              </tr>
            </thead>
            <tbody id="ReturnTable"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const returnForm = document.getElementById("returnBook");
  const tbody = document.getElementById("ReturnTable");
  const addBtn = document.getElementById("returnBookbtn");
  const bookIdInput = document.getElementById("bookId");
  const bookNameInput = document.getElementById("bookName");
  const memberIdInput = document.getElementById("memberId");
  const memberInput = document.getElementById("member");
  const dateInput = document.getElementById("date");
  const bookLookupMessage = document.getElementById("bookLookupMessage");
  const selectedReturnIndices = new Set();

  function readList(key) {
    try {
      const value = JSON.parse(localStorage.getItem(key));
      return Array.isArray(value) ? value : [];
    } catch (error) {
      return [];
    }
  }

  function getCurrentDate() {
    const today = new Date();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    return `${today.getFullYear()}-${month}-${day}`;
  }

  function getIssueId(issue) {
    if (issue.issueId) return String(issue.issueId);
    return `${String(issue.id || "")}|${String(issue.memberId || "")}|${String(issue.date || "")}|${String(issue.name || "")}`;
  }

  function hasReturnRecordForIssue(returnedRecords, issue) {
    return returnedRecords.some(returned => {
      if (returned.issueId) return String(returned.issueId) === getIssueId(issue);
      return !issue.issueId &&
        String(returned.id) === String(issue.id) &&
        String(returned.memberId || "") === String(issue.memberId || "");
    });
  }

  function lookupIssuedBook() {
    const id = bookIdInput.value.trim();
    const memberId = memberIdInput.value.trim();
    bookNameInput.value = "";
    memberInput.value = "";
    dateInput.value = "";

    if (!id) {
      bookLookupMessage.textContent = "Enter an issued Book ID to load its details.";
      bookLookupMessage.className = "form-text";
      return;
    }

    const returnedRecords = readList("returnbooks");
    const issuedBooks = readList("issuedBooks");
    const activeIssues = issuedBooks.filter(book =>
      String(book.id) === id &&
      book.status !== "Returned" &&
      !hasReturnRecordForIssue(returnedRecords, book)
    );
    if (activeIssues.length === 0) {
      bookLookupMessage.textContent = memberId ? "No active issue found for this Book ID and Member ID." : "No active issue found for this Book ID.";
      bookLookupMessage.className = "form-text text-danger";
      return;
    }

    bookNameInput.value = activeIssues[0].name || "";
    if (!memberId && activeIssues.length > 1) {
      bookLookupMessage.textContent = "Multiple members have this book issued. Enter the Member ID to load the return details.";
      bookLookupMessage.className = "form-text text-warning";
      return;
    }

    const issuedBook = memberId
      ? activeIssues.find(book => String(book.memberId || "") === memberId)
      : activeIssues[0];
    if (!issuedBook) {
      bookLookupMessage.textContent = "No active issue found for this Book ID and Member ID.";
      bookLookupMessage.className = "form-text text-danger";
      return;
    }

    bookNameInput.value = issuedBook.name || "";
    memberInput.value = issuedBook.member || "";
    dateInput.value = issuedBook.date || "";
    if (!memberId) memberIdInput.value = issuedBook.memberId || "";
    bookLookupMessage.textContent = `Issue found. Returning ${Number(issuedBook.quantity) > 0 ? Number(issuedBook.quantity) : 1} copy/copies.`;
    bookLookupMessage.className = "form-text text-success";
  }

  function logActivity(type, text) {
    let activities;
    try {
      activities = JSON.parse(localStorage.getItem("activities")) || [];
    } catch {
      activities = [];
    }
    activities.push({ type, text, time: new Date().toISOString() });
    localStorage.setItem("activities", JSON.stringify(activities.slice(-100)));
  }

  // ✅ Load return books from localStorage
  function loadReturnBooks() {
    const returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    tbody.innerHTML = "";
    selectedReturnIndices.forEach(index => {
      if (index >= returnbooks.length) selectedReturnIndices.delete(index);
    });
    returnbooks.forEach((book, index) => {
      const row = `
        <tr>
          <td><input type="checkbox" class="form-check-input return-selection" value="${index}" aria-label="Select returned record for ${book.name}"${selectedReturnIndices.has(index) ? " checked" : ""}></td>
          <td>${book.id}</td>
          <td>${book.name}</td>
          <td>${book.member}</td>
          <td>${Number(book.quantity) || 1}</td>
          <td>${book.returnDate || "-"}</td>
          <td>${book.status}</td>
          <td>
            <div class="d-flex justify-content-center">
              <button class="btn btn-primary me-2" onclick="editBook('${book.id}')">Edit</button>
              <button class="btn btn-danger" data-action="delete" data-index="${index}">Delete</button>
            </div>
          </td>
        </tr>
      `;
      tbody.insertAdjacentHTML("beforeend", row);
    });
    tbody.querySelectorAll("input.return-selection").forEach(checkbox => {
      checkbox.addEventListener("change", () => {
        const index = Number(checkbox.value);
        if (checkbox.checked) selectedReturnIndices.add(index);
        else selectedReturnIndices.delete(index);
        updateReturnSelectionControls(returnbooks.length);
      });
    });
    updateReturnSelectionControls(returnbooks.length);
  }

  function updateReturnSelectionControls(totalReturns) {
    const selectAll = document.getElementById("selectAllReturns");
    const selectedCount = document.getElementById("selectedReturnCount");
    const deleteSelectedButton = document.getElementById("deleteSelectedReturnsBtn");
    const visibleCheckboxes = tbody.querySelectorAll("input.return-selection");
    const selectedVisibleCount = Array.from(visibleCheckboxes).filter(checkbox => checkbox.checked).length;
    selectAll.checked = totalReturns > 0 && selectedVisibleCount === totalReturns;
    selectAll.indeterminate = selectedVisibleCount > 0 && selectedVisibleCount < totalReturns;
    selectedCount.textContent = `${selectedReturnIndices.size} selected`;
    deleteSelectedButton.disabled = selectedReturnIndices.size === 0;
  }

  // ✅ Handle form submission (Add or Update)
  returnForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const id = document.getElementById("bookId").value.trim();
    const name = document.getElementById("bookName").value.trim();
    const memberId = document.getElementById("memberId").value.trim();
    const member = document.getElementById("member").value.trim();
    const date = document.getElementById("date").value.trim();
    const status = "Returned"

    if (!id || !name || !memberId || !member || !date) {
      alert("Please fill all required fields correctly!");
      return;
    }

    const issuedBooks = readList("issuedBooks");
    const issuedBook = issuedBooks.find(book =>
      String(book.id) === String(id) &&
      String(book.memberId || "") === String(memberId) &&
      book.status !== "Returned"
    );
    if (!issuedBook) {
      alert("This Book ID and Member ID are not currently recorded as issued.");
      return;
    }
    if (issuedBook.status === "Returned") {
      alert("This book has already been returned.");
      return;
    }

    const catalogBooks = JSON.parse(localStorage.getItem("books")) || [];
    const catalogBook = catalogBooks.find(book => String(book.id) === String(id));
    if (!catalogBook) {
      alert("This book is missing from the catalog, so its stock cannot be updated.");
      return;
    }

    let returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    if (hasReturnRecordForIssue(returnbooks, issuedBook)) {
      alert("This Book ID for this member has already been returned.");
      return;
    }

    const returnedBook = {
      id,
      name: issuedBook.name,
      member: issuedBook.member,
      memberId: issuedBook.memberId || memberId,
      issueId: getIssueId(issuedBook),
      quantity: Number(issuedBook.quantity) > 0 ? Number(issuedBook.quantity) : 1,
      date: issuedBook.date,
      returnDate: getCurrentDate(),
      status
    };

    returnbooks.push(returnedBook);
    if (issuedBook.stockDeducted === true) {
      const stock = Number(catalogBook.quantity);
      catalogBook.quantity = (Number.isFinite(stock) && stock > 0 ? stock : 0) + returnedBook.quantity;
    }
    issuedBook.status = "Returned";
    localStorage.setItem("books", JSON.stringify(catalogBooks));
    localStorage.setItem("issuedBooks", JSON.stringify(issuedBooks));
    alert("Book returned successfully!");

    localStorage.setItem("returnbooks", JSON.stringify(returnbooks));
    logActivity("return", `Book returned: "${returnedBook.name}" by ${returnedBook.member}`);
    this.reset();
    loadReturnBooks();
  });

  // ✅ Focus Book ID when clicking "Return Book" button
  addBtn.addEventListener("click", (event) => {
    event.preventDefault();
    bookIdInput.focus();
  });

  bookIdInput.addEventListener("input", () => {
    memberIdInput.value = "";
    lookupIssuedBook();
  });
  memberIdInput.addEventListener("input", lookupIssuedBook);
  returnForm.addEventListener("reset", () => {
    memberIdInput.value = "";
    bookLookupMessage.textContent = "Enter an issued Book ID to load its details.";
    bookLookupMessage.className = "form-text";
  });

  function deleteReturnRecords(indices) {
    const returnbooks = readList("returnbooks");
    const indicesToDelete = new Set(indices);
    const deletedReturns = returnbooks.filter((book, index) => indicesToDelete.has(index));
    if (deletedReturns.length === 0) return;

    localStorage.setItem("returnbooks", JSON.stringify(
      returnbooks.filter((book, index) => !indicesToDelete.has(index))
    ));
    deletedReturns.forEach(book => {
      logActivity("return-delete", `Return record deleted for "${book.name}" (Member ID: ${book.memberId || "unknown"})`);
    });
    selectedReturnIndices.clear();
    loadReturnBooks();
  }

  window.deleteBook = function(index) {
    const returnBook = readList("returnbooks")[index];
    if (!returnBook || !confirm("Are you sure you want to delete this return record?")) return;
    deleteReturnRecords([index]);
  };

  tbody.addEventListener("click", event => {
    if (event.target.matches("input.return-selection")) return;
    const button = event.target.closest('button[data-action="delete"]');
    if (button) window.deleteBook(Number(button.dataset.index));
  });

  document.getElementById("selectAllReturns").addEventListener("change", event => {
    tbody.querySelectorAll("input.return-selection").forEach(checkbox => {
      checkbox.checked = event.target.checked;
      const index = Number(checkbox.value);
      if (event.target.checked) selectedReturnIndices.add(index);
      else selectedReturnIndices.delete(index);
    });
    updateReturnSelectionControls(tbody.querySelectorAll("input.return-selection").length);
  });

  document.getElementById("deleteSelectedReturnsBtn").addEventListener("click", () => {
    const returnbooks = readList("returnbooks");
    const selectedIndices = Array.from(selectedReturnIndices).filter(index => index < returnbooks.length);
    if (selectedIndices.length === 0) {
      alert("Select at least one return record to delete.");
      return;
    }
    if (!confirm(`Delete ${selectedIndices.length} selected return record(s)? This cannot be undone.`)) return;
    deleteReturnRecords(selectedIndices);
  });

  // ✅ Edit function
  window.editBook = function(id) {
    const returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    const book = returnbooks.find(b => b.id === id);
    if (!book) return;

    document.getElementById("bookId").value = book.id;
    document.getElementById("bookName").value = book.name;
    document.getElementById("author").value = book.member;
    document.getElementById("Category").value = book.date;
    document.getElementById("year").value = book.status;
  };

  // ✅ Initial load
  loadReturnBooks();
document.querySelector(".btn-danger").addEventListener("click", () => {
  // Remove only login/session data
  localStorage.removeItem("userEmail");
  localStorage.removeItem("userPassword");
  localStorage.removeItem("userRole");
  window.location.href = "../../login/login.html";
});
if (!localStorage.getItem("userRole")) {
  window.location.href = "../../login/login.html";
}

// Prevent forward/back navigation after logout
window.history.forward();
function noBack() {
  window.history.forward();
}

});
</script>


</body>
</html>
