<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Digital Library</title>
  <link rel="stylesheet" href="../register/resgister.css">
  <link rel="icon" type="image/x-icon" href="../images/logo.jpg">
  <link rel="stylesheet" href="../professional-library.css">
</head>
<body>
  <main class="page-shell">
    <section class="register-card" aria-labelledby="register-title">
      <div class="card-header">
        <img src="../images/logo2.jpg" alt="Digital Library" class="brand-logo">
        <p class="eyebrow">Digital Library</p>
        <h1 id="register-title">Create your account</h1>
        <p class="subtitle">Join the library and access your reading space.</p>
      </div>

      <form id="registerForm" autocomplete="on">
        <div class="form-grid">
          <div class="form-group">
            <label for="userName">First name</label>
            <input type="text" id="userName" name="firstName" placeholder="Enter first name" required>
          </div>

          <div class="form-group">
            <label for="last">Last name</label>
            <input type="text" id="last" name="lastName" placeholder="Enter last name">
          </div>

          <div class="form-group full-width">
            <label for="regEmail">Email address</label>
            <input type="email" id="regEmail" name="email" placeholder="you@example.com" required>
          </div>

          <div class="form-group full-width">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" name="password" placeholder="Create a strong password" required>
            <p class="field-hint">Use 8+ characters with uppercase, number and special character.</p>
          </div>

          <div class="form-group">
            <label for="mobile">Contact number</label>
            <input type="text" id="mobile" name="mobile" maxlength="10" inputmode="numeric" placeholder="10-digit number" required>
          </div>

          <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Others">Others</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn">Create account</button>

        <p class="login-text">
          Already have an account? <a href="../Login/login.html">Sign in</a>
        </p>
      </form>
    </section>
  </main>

  <!-- Link to external JS -->
  <script src="../register/register.js"></script>
</body>
</html>
