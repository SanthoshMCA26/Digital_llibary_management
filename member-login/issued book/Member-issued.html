        <form id="issuedForm">

            </div>

  <!-- Script -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const issuedForm = document.getElementById("issuedForm");
  const tbody = document.getElementById("issuedTable");
  const addBtn = document.getElementById("addIssuedBookBtn");

  function logActivity(type, text) {
    let activities;
    try {
      activities = JSON.parse(localStorage.getItem("activities")) || [];
    } catch {
      activities = [];
    }
    activities.push({ type, text, time: new Date().toISOString() });
    localStorage.setItem("activities", JSON.stringify(activities.slice(-100)));
  }

  function getDueDate(issueDate) {
    const [year, month, day] = issueDate.split("-").map(Number);
    const dueMonth = month % 12 + 1;
    const dueYear = year + Math.floor(month / 12);
    const dueDay = Math.min(day, new Date(dueYear, dueMonth, 0).getDate());
    return `${dueYear}-${String(dueMonth).padStart(2, "0")}-${String(dueDay).padStart(2, "0")}`;
  }

  // ✅ Load issued books from localStorage
  function loadIssuedBooks() {
    const books = JSON.parse(localStorage.getItem("issuedBooks")) || [];
    tbody.innerHTML = "";
    books.forEach(book => {
      const row = `
        <tr>
          <td>${book.id}</td>
          <td>${book.name}</td>
          <td>${book.member}</td>
          <td>${book.date}</td>
          <td>${getDueDate(book.date)}</td>
          <td>${book.status}</td>
        </tr>
      `;
      tbody.insertAdjacentHTML("beforeend", row);
    });
  }

  // ✅ Handle form submission (Add or Update)
  issuedForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const id = document.getElementById("bookId").value.trim();
    const name = document.getElementById("bookName").value.trim();
    const member = document.getElementById("member").value.trim();
    const date = document.getElementById("issuedDate").value.trim();
    const status = "Issued";
    

   

    if (!id || !name || !member || !date ) {
      alert("Please fill all required fields correctly!");
      return;
    }

    const catalogBooks = JSON.parse(localStorage.getItem("books")) || [];
    const catalogBook = catalogBooks.find(book => String(book.id) === String(id));
    if (!catalogBook) {
      alert("Book ID not found. Add this book before issuing it.");
      return;
    }
    if (catalogBook.name !== name) {
      alert("Book name does not match the entered Book ID.");
      return;
    }

    let books = JSON.parse(localStorage.getItem("issuedBooks")) || [];
    let reports = JSON.parse(localStorage.getItem("reports")) || [];
    const index = books.findIndex(b => b.id === id);

    if (index !== -1) {
      // Update existing record
      const oldBook = books[index];
      books[index] = { id, name, member, date ,status};
      alert("Book updated successfully!");

      // ✅ Update matching report entry
      const reportIndex = reports.findIndex(r => r.title === oldBook.name && r.member === oldBook.member);
      if (reportIndex !== -1) {
        reports[reportIndex] = {
          member: member,
          title: name,
          date: new Date().toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
          })
        };
      }
    } else {
      // Add new record
      books.push({ id,name, member, date, status });
      alert("Book issued successfully!");

      // ✅ Add report entry for dashboard
      addReport(member, name);
    }

    localStorage.setItem("issuedBooks", JSON.stringify(books));
    localStorage.setItem("reports", JSON.stringify(reports));
    logActivity("issue", `Book issued: "${name}" to ${member}`);
    this.reset();
    loadIssuedBooks();
  });

  // ✅ Focus Book ID when clicking "Add issued book" button
  addBtn.addEventListener("click", (event) => {
    event.preventDefault();
    document.getElementById("bookId").focus();
  });

  // ✅ Delete function (also removes from reports)
  // window.deleteBook = function(id) {
  //   let books = JSON.parse(localStorage.getItem("issuedBooks")) || [];
  //   let reports = JSON.parse(localStorage.getItem("reports")) || [];

  //   if (confirm("Are you sure you want to delete this book?")) {
  //     const bookToDelete = books.find(b => b.id === id);
  //     books = books.filter(b => b.id !== id);
  //     localStorage.setItem("issuedBooks", JSON.stringify(books));

  //     if (bookToDelete) {
  //       reports = reports.filter(r => !(r.title === bookToDelete.name && r.member === bookToDelete.member));
  //       localStorage.setItem("reports", JSON.stringify(reports));
  //     }

  //     alert("Book deleted successfully!");
  //     loadIssuedBooks();
  //   }
  // };

  // // ✅ Edit function (just fills form, actual update happens on submit)
  // window.editBook = function(id) {
  //   const books = JSON.parse(localStorage.getItem("issuedBooks")) || [];
  //   const book = books.find(b => b.id === id);
  //   if (!book) return;

  //   document.getElementById("bookId").value = book.id;
  //   document.getElementById("bookName").value = book.name;
  //   document.getElementById("member").value = book.member;
  //   document.getElementById("issuedDate").value = book.date;
  //   document.getElementById("status").value = book.status;
  // };

  // ✅ Initial load
  loadIssuedBooks();
});

// ✅ Shared function to add report entry
function addReport(memberName, bookName) {
  let reports = JSON.parse(localStorage.getItem("reports")) || [];
  const newReport = {
    title: bookName,
    date: new Date().toLocaleDateString("en-US", {
      month: "long",
      day: "numeric",
      year: "numeric"
    })
  };
  reports.push(newReport);
  localStorage.setItem("reports", JSON.stringify(reports));
}
</script>
