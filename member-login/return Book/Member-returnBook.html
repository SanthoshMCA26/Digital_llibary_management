<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Return Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../images/logo.jpg">
</head>
<body class="bg-light" onload="noBack();">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 fixed-top">
    <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-book-open"></i> Digital Library</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="../DashBoard page/Member-DashBoard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="../book page/Member-books.html">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="../member page/member.html">Members</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar + Main Content -->
  <div class="container-fluid mt-4 pt-3">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-2 bg-warning pt-4 vh-100">
        <ul class="list-unstyled">
          <li class="mb-3"><a href="../book page/Member-books.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-book me-2"></i> Books</a></li>
          <li class="mb-3"><a href="../member page/member.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-users me-2"></i> Members</a></li>
          <li class="mb-3"><a href="#" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-arrow-up me-2"></i> Issue Book</a></li>
          <li class="mb-3"><a href="#" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-arrow-down me-2"></i> Return Book</a></li>
          <li class="mb-3"><a href="#" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-chart-bar me-2"></i> Reports</a></li>
          <li class="mb-3"><a href="about.html" class="btn btn-warning text-dark w-100 text-start rounded-3 shadow-sm"><i class="fa-solid fa-circle-info me-2"></i> About</a></li>
          <li class="mt-4"><a href="../../login/login.html" class="btn btn-danger text-white w-100 text-start rounded-3 shadow-lg"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</a></li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="col-md-10 p-4">
        <header>
          <h2>Return Book Form</h2>
          <a href="#" id="returnBookbtn" class="btn btn-danger mb-4">Return Book</a>
        </header>

        <!-- Return Book Form -->
        <form id="returnBook">
          <div class="row g-3 border border-info border-3 rounded-3 p-2 mb-3">
            <div class="col-md-4">
              <label class="form-label">Book ID</label>
              <input type="number" id="bookId" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Book Name</label>
              <input type="text" id="bookName" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Member</label>
              <input type="text" id="author" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Issued Date</label>
              <input type="date" id="Category" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Status</label>
              <input type="text" id="year" class="form-control" required>
            </div>
            <div class="mt-3 text-center py-2">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="reset" class="btn btn-secondary">Cancel</button>
            </div>
          </div>
        </form>

        <!-- Return Book Table -->
        <table class="table table-bordered text-center">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Book Name</th>
              <th>Member</th>
              <th>Issued Date</th>
              <th>Status</th>
              
            </tr>
          </thead>
          <tbody id="ReturnTable">
            <tr>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              
            </tr>
          </tbody>
        </table>
      </main>
    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const returnForm = document.getElementById("returnBook");
  const tbody = document.getElementById("ReturnTable");
  const addBtn = document.getElementById("returnBookbtn");

  // ✅ Load return books from localStorage
  function loadReturnBooks() {
    const returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    tbody.innerHTML = "";
    returnbooks.forEach(book => {
      const row = `
        <tr>
          <td>${book.id}</td>
          <td>${book.name}</td>
          <td>${book.member}</td>
          <td>${book.date}</td>
          <td>${book.status}</td>
          
        </tr>
      `;
      tbody.insertAdjacentHTML("beforeend", row);
    });
  }

  // ✅ Handle form submission (Add or Update)
  returnForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const id = document.getElementById("bookId").value.trim();
    const name = document.getElementById("bookName").value.trim();
    const member = document.getElementById("author").value.trim();
    const date = document.getElementById("Category").value.trim();
    const status = document.getElementById("year").value.trim();

    if (!id || !name || !member || !date || !status) {
      alert("Please fill all required fields correctly!");
      return;
    }

    let returnbooks = JSON.parse(localStorage.getItem("returnbooks")) || [];
    const index = returnbooks.findIndex(b => b.id === id);

    if (index !== -1) {
      // Update existing record
      returnbooks[index] = { id, name, member, date, status };
      alert("Book updated successfully!");
    } else {
      // Add new record
      returnbooks.push({ id, name, member, date, status });
      alert("Book returned successfully!");
    }

    localStorage.setItem("returnbooks", JSON.stringify(returnbooks));
    this.reset();
    loadReturnBooks();
  });

  // ✅ Focus Book ID when clicking "Return Book" button
  addBtn.addEventListener("click", (event) => {
    event.preventDefault();
    document.getElementById("bookId").focus();
  });


  // ✅ Initial load
  loadReturnBooks();
document.querySelector(".btn-danger").addEventListener("click", () => {
  // Remove only login/session data
  localStorage.removeItem("userEmail");
  localStorage.removeItem("userPassword");
  localStorage.removeItem("userRole");
  window.location.href = "../../login/login.html";
});
if (!localStorage.getItem("userRole")) {
  window.location.href = "../../login/login.html";
}

// Prevent forward/back navigation after logout
window.history.forward();
function noBack() {
  window.history.forward();
}

});
</script>

</body>
</html>
